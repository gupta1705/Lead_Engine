<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — TVF Lead Engine</title>
<script>
try { var t = localStorage.getItem("tvf_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Self-contained on purpose: this page sits OUTSIDE the auth wall, so it must
   not pull the app's assets with it. Tokens mirror style.css (Atlassian set). */
:root {
  --surface: #FFFFFF; --sunken: #F7F8F9; --text: #172B4D; --subtle: #44546F;
  --subtlest: #626F86; --border-input: #8590A2; --focused: #388BFF;
  --brand: #0C66E4; --brand-hover: #0055CC; --brand-pressed: #09326C;
  --danger-bg: #FFECEB; --danger-text: #AE2E24; --link: #0C66E4;
  --shadow: 0 8px 12px #091E4226, 0 0 1px #091E424F; --on-bold: #FFFFFF;
  --input: #FFFFFF; --input-hover: #F7F8F9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #22272B; --sunken: #1D2125; --text: #B6C2CF; --subtle: #9FADBC;
    --subtlest: #8C9BAB; --border-input: #738496; --focused: #85B8FF;
    --brand: #579DFF; --brand-hover: #85B8FF; --brand-pressed: #CCE0FF;
    --danger-bg: #42221F; --danger-text: #FD9891; --link: #579DFF;
    --shadow: 0 0 0 1px #A6C5E229, 0 8px 12px #0304045C; --on-bold: #1D2125;
    --input: #22272B; --input-hover: #282E33;
  }
}
:root[data-theme="dark"] {
  --surface: #22272B; --sunken: #1D2125; --text: #B6C2CF; --subtle: #9FADBC;
  --subtlest: #8C9BAB; --border-input: #738496; --focused: #85B8FF;
  --brand: #579DFF; --brand-hover: #85B8FF; --brand-pressed: #CCE0FF;
  --danger-bg: #42221F; --danger-text: #FD9891; --link: #579DFF;
  --shadow: 0 0 0 1px #A6C5E229, 0 8px 12px #0304045C; --on-bold: #1D2125;
  --input: #22272B; --input-hover: #282E33;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 24px 16px; background: var(--sunken); color: var(--text);
  font: 14px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: var(--text);
  font-size: 20px; font-weight: 600; }
.mark { width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center;
  justify-content: center; color: #fff; background: linear-gradient(135deg, #0C66E4, #1D7AFC); }
.card { width: min(400px, 100%); background: var(--surface); border-radius: 3px;
  box-shadow: var(--shadow); padding: 32px 40px 40px; }
h1 { font-size: 16px; line-height: 20px; font-weight: 600; margin: 0 0 4px; text-align: center; }
.sub { color: var(--subtlest); font-size: 12px; text-align: center; margin: 0 0 24px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--subtle); margin: 16px 0 4px; }
input {
  width: 100%; height: 40px; padding: 8px; border: 2px solid var(--border-input); border-radius: 3px;
  background: var(--input); color: var(--text); font: inherit; transition: background .15s, border-color .15s;
}
input:hover { background: var(--input-hover); }
input:focus { outline: 0; border-color: var(--focused); background: var(--surface); }
button {
  width: 100%; height: 40px; margin-top: 24px; border: 0; border-radius: 3px; cursor: pointer;
  background: var(--brand); color: var(--on-bold); font: inherit; font-weight: 600;
  transition: background .15s;
}
button:hover { background: var(--brand-hover); }
button:active { background: var(--brand-pressed); }
button:focus-visible { outline: 2px solid var(--focused); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.err { display: none; margin-top: 16px; padding: 12px 16px; border-radius: 3px;
  background: var(--danger-bg); color: var(--danger-text); font-size: 14px; }
.err.show { display: block; }
.hint { color: var(--subtlest); font-size: 12px; margin: 16px 0 0; text-align: center; }
.foot { margin-top: 32px; color: var(--subtlest); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="brand">
  <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span>
  Lead Engine
</div>
<div class="card">
  <h1 id="title">Log in to continue</h1>
  <p class="sub" id="subtitle">TVF Universal Lead Engine</p>
  <form id="f" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required inputmode="email" spellcheck="false">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Log in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="hint" id="hint"></p>
</div>
<p class="foot">Internal tool. Access is by invitation from the workspace owner.</p>
<script>
let mode = "login";
(async () => {
  try {
    const s = await (await fetch("/api/auth/state")).json();
    if (s.authed) { location.href = "/"; return; }
    if (s.needs_setup) {
      mode = "setup";
      document.querySelector("#title").textContent = "Create the owner account";
      document.querySelector("#subtitle").textContent = "First run: this account will own the workspace.";
      document.querySelector("#go").textContent = "Create account";
      document.querySelector("#password").autocomplete = "new-password";
      document.querySelector("#hint").textContent =
        "Use 10 or more characters. Add teammates later with tools/users.py.";
    }
  } catch (e) { /* login still works if state fails */ }
})();
document.querySelector("#f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const go = document.querySelector("#go"), err = document.querySelector("#err");
  const email = document.querySelector("#email").value.trim();
  const password = document.querySelector("#password").value;
  err.className = "err";
  if (!email || !password) {
    err.textContent = "Enter your email and password."; err.className = "err show"; return;
  }
  go.disabled = true;
  try {
    const r = await fetch("/api/auth/" + mode, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    location.href = "/";
  } catch (e) {
    err.textContent = e.message === "wrong email or password"
      ? "That email and password did not match. Check both and try again."
      : e.message;
    err.className = "err show"; go.disabled = false;
  }
});
</script>
</body>
</html>
