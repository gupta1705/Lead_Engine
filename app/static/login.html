<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Log in — TVF Lead Engine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5A5F'/%3E%3Cstop offset='1' stop-color='%23D7263D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M9.5 7.6v8.8l7-4.4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Plus+Jakarta+Sans:wght@600..800&display=swap">
<style>
/* Self-contained on purpose: this page sits OUTSIDE the auth wall, so it must
   not pull the app's assets with it. Tokens mirror style.css (2026-09-27 set). */
:root {
  color-scheme: light;
  --canvas: #F1F2F5; --surface: #FFFFFF; --text: #101828; --subtle: #475467; --subtlest: #667085;
  --border: #E4E7EC; --border-input: #D0D5DD; --focused: #6366F1; --ring: 0 0 0 3px rgba(99, 102, 241, .24);
  --brand: #4F46E5; --brand-hover: #4338CA; --brand-pressed: #3730A3; --on-bold: #FFFFFF;
  --danger-bg: #FEF3F2; --danger-text: #D92D20; --placeholder: #98A2B3;
  --glow-1: rgba(99, 102, 241, .16); --glow-2: rgba(255, 90, 95, .12);
  --shadow: 0 24px 48px -16px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .05);
  --mark-from: #FF5A5F; --mark-to: #D7263D;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --canvas: #08090C; --surface: #14161B; --text: #F0F1F3; --subtle: #B9BEC7; --subtlest: #8E949E;
    --border: #FFFFFF14; --border-input: #FFFFFF24; --focused: #818CF8; --ring: 0 0 0 3px rgba(129, 140, 248, .3);
    --brand: #5558E8; --brand-hover: #6366F1; --brand-pressed: #4F46E5; --on-bold: #FFFFFF;
    --danger-bg: #F044381F; --danger-text: #FDA29B; --placeholder: #5B616B;
    --glow-1: rgba(99, 102, 241, .20); --glow-2: rgba(255, 90, 95, .10);
    --shadow: 0 30px 60px -12px rgba(0, 0, 0, .7), 0 0 0 1px #FFFFFF14;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 32px 16px; color: var(--text);
  background:
    radial-gradient(900px 520px at 18% -10%, var(--glow-1), transparent 60%),
    radial-gradient(760px 480px at 100% 110%, var(--glow-2), transparent 60%),
    var(--canvas);
  font: 14px/20px var(--font); font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; color: var(--text);
  font: 700 20px/24px var(--font-display); letter-spacing: -.015em; }
.mark { width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center;
  justify-content: center; color: #fff; background: linear-gradient(135deg, var(--mark-from), var(--mark-to));
  box-shadow: 0 6px 16px -4px rgba(215, 38, 61, .55), inset 0 1px 0 rgba(255, 255, 255, .25); }
.mark svg { margin-left: 2px; }
.brand small { display: block; font: 500 12px/16px var(--font); color: var(--subtlest); letter-spacing: 0; }
.card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
  box-shadow: var(--shadow); padding: 32px 32px 28px; animation: rise .35s cubic-bezier(.16, 1, .3, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
h1 { font: 700 22px/28px var(--font-display); letter-spacing: -.02em; margin: 0 0 6px; }
.sub { color: var(--subtlest); font-size: 13.5px; margin: 0 0 24px; }
label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin: 16px 0 6px; }
label:first-of-type { margin-top: 0; }
input {
  width: 100%; height: 42px; padding: 9px 12px; border: 1px solid var(--border-input); border-radius: 10px;
  background: var(--surface); color: var(--text); font: 15px/22px var(--font);
  box-shadow: 0 1px 2px rgba(16, 24, 40, .05); transition: border-color .15s, box-shadow .15s;
}
input:hover { border-color: var(--subtlest); }
input:focus { outline: 0; border-color: var(--focused); box-shadow: var(--ring); }
input::placeholder { color: var(--placeholder); }
button {
  width: 100%; height: 42px; margin-top: 24px; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--brand); color: var(--on-bold); font: 600 14.5px/1 var(--font);
  box-shadow: 0 1px 2px rgba(16, 24, 40, .14), inset 0 1px 0 rgba(255, 255, 255, .16);
  transition: background .15s, transform .08s;
}
button:hover { background: var(--brand-hover); }
button:active { background: var(--brand-pressed); transform: translateY(.5px); }
button:focus-visible { outline: 2px solid var(--focused); outline-offset: 2px; }
button:disabled { opacity: .6; cursor: default; }
.err { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 10px;
  background: var(--danger-bg); color: var(--danger-text); font-size: 13.5px; }
.err.show { display: block; }
.hint { color: var(--subtlest); font-size: 12.5px; margin: 16px 0 0; text-align: center; }
.hint:empty { display: none; }
.foot { margin-top: 28px; color: var(--subtlest); font-size: 12.5px; text-align: center; max-width: 36ch; }
@media (max-width: 480px) { .card { padding: 26px 22px 22px; border-radius: 16px; } input { font-size: 16px; } }
</style>
</head>
<body>
<div class="brand">
  <span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
  <span>Lead Engine<small>The Viral Fever</small></span>
</div>
<div class="card">
  <h1 id="title">Log in to continue</h1>
  <p class="sub" id="subtitle">TVF Universal Lead Engine</p>
  <form id="f" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required inputmode="email" spellcheck="false" placeholder="you@theviralfever.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Log in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="hint" id="hint"></p>
</div>
<p class="foot">Internal tool. Access is by invitation from the workspace owner.</p>
<script>
let mode = "login";
// where to go once signed in: an MCP client's "allow" page (app/oauth.py), or the app; only a path on this site
const NEXT = (() => {
  const n = new URLSearchParams(location.search).get("next") || "";
  return n.startsWith("/oauth/authorize?") && !n.includes("\\") && !n.includes("//") ? n : "/";
})();
(async () => {
  try {
    const s = await (await fetch("/api/auth/state")).json();
    if (s.authed) { location.href = NEXT; return; }
    if (s.needs_setup) {
      mode = "setup";
      document.querySelector("#title").textContent = "Create the owner account";
      document.querySelector("#subtitle").textContent = "First run: this account will own the workspace.";
      document.querySelector("#go").textContent = "Create account";
      document.querySelector("#password").autocomplete = "new-password";
      document.querySelector("#hint").textContent =
        "Use 10 or more characters. Add teammates later with tools/users.py.";
    }
  } catch (e) { /* login still works if state fails */ }
})();
document.querySelector("#f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const go = document.querySelector("#go"), err = document.querySelector("#err");
  const email = document.querySelector("#email").value.trim();
  const password = document.querySelector("#password").value;
  err.className = "err";
  if (!email || !password) {
    err.textContent = "Enter your email and password."; err.className = "err show"; return;
  }
  go.disabled = true;
  try {
    const r = await fetch("/api/auth/" + mode, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    location.href = NEXT;
  } catch (e) {
    err.textContent = e.message === "wrong email or password"
      ? "That email and password did not match. Check both and try again."
      : e.message;
    err.className = "err show"; go.disabled = false;
  }
});
</script>
</body>
</html>
