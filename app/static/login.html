<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — TVF Lead Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Self-contained on purpose: this page sits OUTSIDE the auth wall, so it must
   not pull the app's assets with it. Tokens mirror style.css. */
:root {
  --bg: #F8FAFC; --panel: #FFFFFF; --line: #DBEAFE; --ink: #0F172A;
  --dim: #475569; --primary: #1E40AF; --accent: #D97706; --bad: #DC2626;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0B1220; --panel: #111A2E; --line: #1E3A5F; --ink: #E2E8F0;
          --dim: #94A3B8; --primary: #60A5FA; --accent: #FBBF24; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center;
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Fira Sans", ui-sans-serif, system-ui, sans-serif; }
.card { width: min(400px, calc(100vw - 32px)); background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.mark { font-family: "Fira Code", monospace; font-weight: 600; font-size: 13px;
  color: #fff; background: var(--primary); padding: 4px 8px; border-radius: 6px; }
h1 { font-size: 19px; margin: 0; font-weight: 600; }
.sub { color: var(--dim); font-size: 13px; margin: 4px 0 22px; }
label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 5px; }
input { width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
input:focus { outline: 2px solid var(--primary); outline-offset: 1px;
  border-color: var(--primary); }
button { width: 100%; margin-top: 20px; padding: 12px; font: inherit;
  font-weight: 600; color: #fff; background: var(--primary); border: 0;
  border-radius: 8px; cursor: pointer; transition: filter .15s; }
button:hover { filter: brightness(1.1); }
button:disabled { opacity: .5; cursor: default; }
.err { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 18px; }
.hint { color: var(--dim); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">TVF</span><h1 id="title">Sign in</h1></div>
  <p class="sub" id="subtitle">Lead Engine — team access</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <p class="hint" id="hint"></p>
</div>
<script>
let mode = "login";
(async () => {
  try {
    const s = await (await fetch("/api/auth/state")).json();
    if (s.authed) { location.href = "/"; return; }
    if (s.needs_setup) {
      mode = "setup";
      document.querySelector("#title").textContent = "Create the owner account";
      document.querySelector("#subtitle").textContent =
        "First run — this account will own the workspace.";
      document.querySelector("#go").textContent = "Create account";
      document.querySelector("#password").autocomplete = "new-password";
      document.querySelector("#hint").textContent =
        "Use 10+ characters. Add teammates later with tools/users.py.";
    }
  } catch (e) { /* login still works if state fails */ }
})();
document.querySelector("#f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const go = document.querySelector("#go"), err = document.querySelector("#err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/auth/" + mode, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.querySelector("#email").value,
                             password: document.querySelector("#password").value }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    location.href = "/";
  } catch (e) { err.textContent = e.message; go.disabled = false; }
});
</script>
</body>
</html>
