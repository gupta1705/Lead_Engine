# render.yaml -- Render Blueprint: the whole cloud deployment as one file.
#
#   Render -> New + -> Blueprint -> pick this repo -> Apply.
#
# Render reads this, creates the service on the FREE plan (no card), builds the
# Dockerfile, and asks for exactly one value: SUPABASE_DB_URL. Everything else
# is declared here. See docs/DEPLOY.md, "Free cloud, no credit card".
#
# Why these choices:
#   plan: free          512 MB / shared CPU; enough for the UI and the
#                       network-bound enrichment jobs. 750 free hours a month
#                       is one always-on service -- do not add a second.
#   region: singapore   the closest Render region to India and to a Supabase
#                       project in ap-south-1.
#   healthCheckPath     /api/health opens a real DB connection, so "healthy"
#                       means the database is reachable, not just the process.
#   SESSION_SECRET      generated by Render at creation; never in the repo.
#   SCHEDULER_ENABLED   the Tuesday 02:00 UTC weekly refresh runs here. It
#                       only fires while the instance is awake -- keep it
#                       awake with a free uptime ping (docs/DEPLOY.md).
#
# Optional values are added later in the dashboard (service -> Environment):
#   ALERT_WEBHOOK_URL, GMAIL_SENDER_ADDRESS, GOOGLE_OAUTH_CLIENT_ID,
#   GOOGLE_OAUTH_CLIENT_SECRET, GMAIL_TOKEN_JSON, ANTHROPIC_API_KEY.
#   GOOGLE_OAUTH_WEB_CLIENT_ID, GOOGLE_OAUTH_WEB_CLIENT_SECRET (2026-09-26): a Google OAuth
#   client of type "Web application" with the redirect URI
#   https://tvf-lead-engine.onrender.com/api/mailboxes/callback -- what lets each person
#   connect their own Gmail from the app (app/mailbox_connect.py). Their sign-ins are kept
#   encrypted with a key derived from SESSION_SECRET: regenerating SESSION_SECRET means
#   everyone connects their Gmail again (and signs in again).
# Needed by particular projects:
#   YOUTUBE_API_KEY   LCX's weekly refresh stops at its YouTube step without it
#                     (Operations -> Automatic runs shows "Failed at discover_youtube").
#   GROQ_API_KEY      drafts get their model-written lines; without it they use
#                     the plain template wording.
#   APOLLO_API_KEY    the Universal project's Apollo search page.

services:
  - type: web
    name: tvf-lead-engine
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SUPABASE_DB_URL
        sync: false                # prompted for once; the only secret you type
      - key: SESSION_SECRET
        generateValue: true        # Render generates a random one
      - key: SCHEDULER_ENABLED
        value: "1"
      - key: SEGMENT_SLUG
        value: us-production-houses
      - key: TZ
        value: Asia/Kolkata
