<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="340" fill="#FFFFFF"/>

  <!-- row 1 -->
  <g>
    <rect x="20" y="20" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="46" cy="48" r="15" fill="#0C66E4"/><text x="46" y="53.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="70" y="54" font-size="19" font-weight="700" fill="#172B4D">Find</text>
    <text x="34" y="84" font-size="14.5" fill="#44546F">YouTube, podcasts, news,</text>
    <text x="34" y="104" font-size="14.5" fill="#44546F">Wikidata, directories</text>
    <text x="34" y="124" font-size="14.5" fill="#44546F">and Apollo</text>
  </g>
  <g>
    <rect x="270" y="20" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="296" cy="48" r="15" fill="#0C66E4"/><text x="296" y="53.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="320" y="54" font-size="19" font-weight="700" fill="#172B4D">Check &amp; fill in</text>
    <text x="284" y="84" font-size="14.5" fill="#44546F">Website, email, size,</text>
    <text x="284" y="104" font-size="14.5" fill="#44546F">news. Their own site</text>
    <text x="284" y="124" font-size="14.5" fill="#44546F">first, then Apollo</text>
  </g>
  <g>
    <rect x="520" y="20" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="546" cy="48" r="15" fill="#0C66E4"/><text x="546" y="53.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="570" y="54" font-size="19" font-weight="700" fill="#172B4D">Score</text>
    <text x="534" y="84" font-size="14.5" fill="#44546F">Points out of 100 on</text>
    <text x="534" y="104" font-size="14.5" fill="#44546F">the project's checklist;</text>
    <text x="534" y="124" font-size="14.5" fill="#44546F">misfits filtered out</text>
  </g>
  <g>
    <rect x="770" y="20" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="796" cy="48" r="15" fill="#0C66E4"/><text x="796" y="53.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="820" y="54" font-size="19" font-weight="700" fill="#172B4D">Shortlist</text>
    <text x="784" y="84" font-size="14.5" fill="#44546F">Automatic above a line</text>
    <text x="784" y="104" font-size="14.5" fill="#44546F">(30 production houses,</text>
    <text x="784" y="124" font-size="14.5" fill="#44546F">20 LCX), or by you</text>
  </g>
  <line x1="230" y1="80" x2="266" y2="80" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="80" x2="516" y2="80" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="80" x2="766" y2="80" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the turn from row 1 to row 2 -->
  <path d="M875,140 L875,165 L125,165 L125,196" fill="none" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- row 2 -->
  <g>
    <rect x="20" y="200" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="46" cy="228" r="15" fill="#0C66E4"/><text x="46" y="233.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    <text x="70" y="234" font-size="19" font-weight="700" fill="#172B4D">Draft</text>
    <text x="34" y="264" font-size="14.5" fill="#44546F">The owner's own words,</text>
    <text x="34" y="284" font-size="14.5" fill="#44546F">plus a paragraph about</text>
    <text x="34" y="304" font-size="14.5" fill="#44546F">the company</text>
  </g>
  <g>
    <rect x="270" y="200" width="210" height="120" rx="10" fill="#FFF7D6" stroke="#E2B203" stroke-width="2"/>
    <circle cx="296" cy="228" r="15" fill="#B38600"/><text x="296" y="233.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
    <text x="320" y="234" font-size="19" font-weight="700" fill="#172B4D">Approve (you)</text>
    <text x="284" y="264" font-size="14.5" fill="#44546F">A person reads every</text>
    <text x="284" y="284" font-size="14.5" fill="#44546F">email. Nothing is sent</text>
    <text x="284" y="304" font-size="14.5" fill="#44546F">without approval</text>
  </g>
  <g>
    <rect x="520" y="200" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="546" cy="228" r="15" fill="#0C66E4"/><text x="546" y="233.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="570" y="234" font-size="19" font-weight="700" fill="#172B4D">Send</text>
    <text x="534" y="264" font-size="14.5" fill="#44546F">From the connected</text>
    <text x="534" y="284" font-size="14.5" fill="#44546F">Gmail: up to 35 a day,</text>
    <text x="534" y="304" font-size="14.5" fill="#44546F">the rest the next day</text>
  </g>
  <g>
    <rect x="770" y="200" width="210" height="120" rx="10" fill="#E9F2FF" stroke="#85B8FF" stroke-width="1.5"/>
    <circle cx="796" cy="228" r="15" fill="#0C66E4"/><text x="796" y="233.5" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
    <text x="820" y="234" font-size="19" font-weight="700" fill="#172B4D">Replies</text>
    <text x="784" y="264" font-size="14.5" fill="#44546F">Answers land in the</text>
    <text x="784" y="284" font-size="14.5" fill="#44546F">mailbox; "no thanks"</text>
    <text x="784" y="304" font-size="14.5" fill="#44546F">means never again</text>
  </g>
  <line x1="230" y1="260" x2="266" y2="260" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="260" x2="516" y2="260" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="260" x2="766" y2="260" stroke="#44546F" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
